<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pinball Pals Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --cream:#fff6e8; --ink:#5a4660; --soft:#8a7691; --pink:#ff8fb1; --blue:#8fc7ff; --lilac:#c9b6ff; --mint:#a6ecd0; --sun:#ffe08a; --bg:#f6ecff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Fredoka, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { margin: 0 0 4px; } h2 { margin: 0 0 10px; font-size: 20px; }
  .card { background: var(--cream); border: 3px solid var(--ink); border-radius: 22px; padding: 16px 18px; box-shadow: 0 5px 0 rgba(90,70,96,.2); margin-top: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  button, select, input { font: inherit; color: inherit; }
  button { background: var(--lilac); border: 3px solid var(--ink); border-radius: 14px; padding: 6px 14px; cursor: pointer; font-weight: 600; box-shadow: 0 3px 0 rgba(90,70,96,.25); }
  button:active { transform: translateY(2px); box-shadow: none; }
  button.pink { background: var(--pink); } button.blue { background: var(--blue); } button.mint { background: var(--mint); }
  select, input[type=text], input[type=password] { background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 5px 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #b9adbf; border: 2px solid var(--ink); display: inline-block; }
  .dot.on { background: #6fe3a5; }
  .links a, .links code { word-break: break-all; font-size: 14px; }
  .links div { margin: 6px 0; }
  #log { height: 190px; overflow: auto; background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 8px 10px; font: 13px/1.5 ui-monospace, monospace; }
  .muted { color: var(--soft); font-size: 14px; }
  #login { max-width: 380px; margin: 14vh auto; text-align: center; }
  .hidden { display: none !important; }
  #dexgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; max-height: 420px; overflow: auto; }
  #dexgrid div { border: 2px solid var(--ink); border-radius: 10px; padding: 3px 8px; font-size: 14px; background: #fff; cursor: pointer; }
  #dexgrid .seen { background: #ece5f6; } #dexgrid .caught.zoe { background: #ffd4e1; } #dexgrid .caught.clara { background: #d4e9ff; }
  #dexgrid .caught:not(.zoe):not(.clara) { background: var(--mint); }
</style>
</head>
<body>
<main>
  <div class="card" id="login">
    <h1>Pinball Pals 💖</h1>
    <p class="muted">Admin password</p>
    <form id="lf"><input type="password" id="pw" autocomplete="current-password"> <button class="pink">Let me in</button></form>
    <p id="lerr" class="muted"></p>
  </div>

  <div id="app" class="hidden">
    <h1>Pinball Pals admin</h1>
    <div class="muted" id="sub"></div>

    <div class="grid">
      <div class="card">
        <h2>Right now</h2>
        <div class="row"><span class="dot" id="dz"></span> <b id="lz">Zoe</b> <span class="dot" id="dc"></span> <b id="lc">Clara</b></div>
        <div style="font-size:32px;font-weight:700" id="prog">0 / 205</div>
        <div class="muted" id="tally"></div>
        <div class="row" style="margin-top:12px">
          <button class="pink" onclick="test('zoe')">Test catch (Zoe)</button>
          <button class="blue" onclick="test('clara')">Test catch (Clara)</button>
        </div>
      </div>

      <div class="card">
        <h2>Session</h2>
        <div class="muted" id="sess"></div>
        <div class="row">
          <button class="mint" onclick="post('recap')">Show recap card</button>
          <button onclick="if(confirm('Start a new session? (the dex is untouched)')) post('resetsession')">New session</button>
          <button class="pink" onclick="if(prompt('This erases the whole shared dex and history. Type RESET to confirm.')==='RESET') post('resetall',{confirm:'RESET'})">Reset everything</button>
        </div>
        <h2 style="margin-top:14px">Bounty</h2>
        <div class="row"><select id="bsel"></select> <button onclick="post('bounty',{slot:+$('bsel').value})">Set</button> <button onclick="post('bounty',{slot:null})">Clear</button></div>
        <div class="row"><button class="mint" onclick="post('votes',{action:'open',seconds:60})">Open 60s chat vote</button> <button onclick="post('votes',{action:'close'})">Close vote</button></div>
      </div>

      <div class="card">
        <h2>Overlay settings</h2>
        <div class="row"><label>Volume <input type="range" id="vol" min="0" max="1" step="0.05"></label></div>
        <div class="row"><label><input type="checkbox" id="rm"> Reduce motion</label></div>
        <div class="row"><button onclick="saveSettings()">Save</button></div>
      </div>
    </div>

    <div class="card links"><h2>Links</h2><div id="links"></div></div>

    <div class="card">
      <h2>Fix a slot</h2>
      <div class="muted">Click a Pokémon, then pick what it should be. Grey = unseen, purple = seen, pink/blue = caught first by Zoe/Clara.</div>
      <div class="row">
        <select id="ssel"></select>
        <select id="sstate"><option>unseen</option><option>seen</option><option>caught</option></select>
        <select id="sby"><option value="">credit: nobody</option><option value="zoe">credit: Zoe</option><option value="clara">credit: Clara</option></select>
        <button onclick="setSlot()">Apply</button>
      </div>
      <div id="dexgrid"></div>
    </div>

    <div class="card"><h2>Log</h2><div id="log"></div></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let PW = sessionStorage.getItem("pp-admin") || "", SP = [], ST = null;

async function api(route, body) {
  const r = await fetch("/api/admin/" + route, { method: body ? "POST" : "GET", headers: { authorization: "Bearer " + PW, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) throw new Error("bad password");
  return r.json();
}
const post = (route, body = {}) => api(route, body).catch((e) => alert(e.message));
const test = (by) => post("testcatch", { by });
function saveSettings() { post("settings", { volume: +$("vol").value, reduceMotion: $("rm").checked }); }
function setSlot() { post("setslot", { slot: +$("ssel").value, state: $("sstate").value, by: $("sby").value }); }

function render(st, links) {
  ST = st;
  $("dz").classList.toggle("on", st.players.zoe.online); $("dc").classList.toggle("on", st.players.clara.online);
  $("lz").textContent = st.players.zoe.label; $("lc").textContent = st.players.clara.label;
  $("prog").textContent = `${st.caught} / ${st.total}`;
  $("tally").textContent = `${st.players.zoe.label} ${st.tally.zoe} · ${st.players.clara.label} ${st.tally.clara} · ${st.seen} seen only`;
  $("sess").textContent = `Session started ${new Date(st.session.startedAt).toLocaleString()} · ${st.session.newThisSession.length} new tonight · bounty: ${st.bounty == null ? "none" : SP[st.bounty]?.name}`;
  $("vol").value = st.settings.volume; $("rm").checked = st.settings.reduceMotion;
  $("dexgrid").innerHTML = SP.map((s) => { const d = st.dex[s.slot]; return `<div data-s="${s.slot}" class="${d?.state ?? ""} ${d?.firstBy ?? ""}">${String(s.slot + 1).padStart(3, "0")} ${s.name}</div>`; }).join("");
  if (links) $("links").innerHTML = [["Overlay (OBS browser source, 1920×1080)", links.overlay], ["Zoe's setup page", links.zoeSetup], ["Clara's setup page (send her this)", links.claraSetup]]
    .map(([t, u]) => `<div><b>${t}</b><br><a href="${u}" target="_blank"><code>${location.origin}${u}</code></a></div>`).join("");
}
$("dexgrid")?.addEventListener("click", (e) => { const s = e.target.closest("[data-s]"); if (s) $("ssel").value = s.dataset.s; });

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?pw=${encodeURIComponent(PW)}`);
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "state") render(m.state);
    if (m.type === "logs") { $("log").textContent = m.lines.join("\n"); $("log").scrollTop = 1e9; }
    if (m.type === "log") { $("log").textContent += "\n" + m.line; $("log").scrollTop = 1e9; }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

async function start() {
  try {
    const r = await api("state");
    SP = await (await fetch("/data/species.json")).json();
    $("bsel").innerHTML = $("ssel").innerHTML = SP.map((s) => `<option value="${s.slot}">${String(s.slot + 1).padStart(3, "0")} ${s.name}</option>`).join("");
    $("login").classList.add("hidden"); $("app").classList.remove("hidden");
    render(r.state, r.links);
    connect();
  } catch (e) { $("lerr").textContent = PW ? "Hmm, that password didn't work." : ""; $("login").classList.remove("hidden"); }
}
$("lf").onsubmit = (e) => { e.preventDefault(); PW = $("pw").value; sessionStorage.setItem("pp-admin", PW); start(); };
if (PW) start();
</script>
</body>
</html>
